<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>루비 문자 학습</title>
    <style>
        rt {
            color: rgb(30, 151, 95);
            font-weight: bold;
            background-color: rgb(204, 251, 149);
        }
    </style>
</head>

<body>
    <h1>루비 문자(Ruby Text)</h1>
    <p>
        한자 예시:
        <ruby>韓<rt>한</rt> 子<rt>자</rt></ruby>
    </p>
    <p>
        한글 예시:
        <ruby>청<rt>靑</rt>출<rt>出</rt>어<rt>於</rt>람<rt>藍</rt></ruby>(푸른색은 쪽에서 나왔지만 족빛보다 더 푸르다)
        <!-- <ruby><strong>청</strong><rt>靑</rt><strong>출</strong><rt>出</rt><strong>어</strong><rt>於</rt><strong>람</strong><rt>藍</rt></ruby>(푸른색은 쪽에서 나왔지만 족빛보다 더 푸르다) -->
    </p>
    <p>
        일본어 예시:
        <ruby>學生 <mark>がくせいです</mark></ruby>
    </p>

    <hr />

    <p>
        한자 예시:
        韓한 子자
    </p>
    <p>
        한글 예시:
        청출어람 靑出於藍(푸른색은 쪽에서 나왔지만 족빛보다 더 푸르다)
    </p>
    <p>
        일본어 예시:
        學生 がくせいです
    </p>
    <hr />
</body>

</html>
