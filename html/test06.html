<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>앵커링크연습 a태그</title>
</head>

<body>
    <center>
        <!--링크(a태그)에 속성 적용-->
        <a href="https://www.naver.com" target="_blank" title="네이버로이동!">예제 사이트 방문</a>
        <br>
        <br>
        <!--이미지(img태그)에 속성 적용-->
        <img src="../img/강아지1.png" alt="하얀색 비숑" width="300">
        <img src="../img/강아지2.png" alt="닥스훈트" width="300">

        <br>
        <br>
        <!--입력폼(input태그)에 속성 적용-->
        <form action="submit.php" method="get">
            <label>사용자이름:</label>
            <input type="text" id="username" name="username" placeholder="이름입력" required="required">
            <input type="submit" value="submit">
        </form>

        <!--단락(p태그)에 속성 적용-->
        <p style="color: rgb(80, 159, 102); font-weight: bold;">이 문장은 초록색 굵은 글씨입니다.</p>
    </center>
</body>

</html>
