<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>IoT 연결대시보드</title>
	<style>
		.box {
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			min-height: 100vh;
		}

		.temp {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 10px;
		}

		.temp-btn {
			margin-top: 20px;
			width: 90px;
			height: 40px;
			background-color: rgb(79, 143, 252);
			color: white;
			border: none;
			border-radius: 40px;
			cursor: pointer;
		}

		.temp-btn:hover {
			background-color: rgb(45, 109, 218);
		}

		.temp input {
			width: 50px;
			/* height: 35px; */
		}

		.temp-card {
			border: 5px solid rgb(25, 99, 177);
			border-radius: 500px;
			padding: 100px;
			text-align: center;
		}
	</style>
</head>

<body>
	<div class="box">
		<div class="temp-card">
			<h1 style="color: rgb(25, 99, 177);">IoT 연결대시보드 - 온도 설정</h1>

			<div class="temp"><label for="temperature">온도 설정(℃):</label>
				<input type="number" id="temperature" min="16" max="30" step="0.1" value="22">
			</div>

			<button class="temp-btn" onclick="온도설정()" style="margin-top: 20px;">온도 조정</button>


			<h4>설정된 온도 : <span id="currentTemp" style="color:rgb(239, 64, 37);">22</span>℃</h4>


			<script>
				function 온도설정() {
					var temp = document.getElementById('temperature').value;
					document.getElementById('currentTemp').textContent = temp;
					alert("온도 " + temp + "°C로 설정되었습니다.");
				}
			</script>

		</div>
	</div>
</body>

</html>
