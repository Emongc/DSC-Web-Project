<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>앵커 태그 2단계 - 다양한 링크</title>

    <style>
        * {
            margin: 10px;
            padding: 0px;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        
    </style>

</head>

<body id="top">
    <h1 style="color: rgb(54, 142, 0);">📌 앵커 태그 2단계 : 다양한 링크 만들기</h1>

    <!-- ① 새 창 링크 + 보안 속성 rel~~ -->
    <!-- "target=blank"를 적용할 때 rel="nooperner noreferrer" -->
    <h2 style="color: rgb(83, 148, 74);">&#9312; 새창 / 현재 창 링크</h2>
    <p>
        <a href="https://www.google.com" target="_blank" rel="nooperner noreferrer">구글(새 창)</a>
        <a href="https://www.google.com" target="_self" rel="nooperner noreferrer">구글(현재 창)</a>
    </p>

    <br>

    <!-- ② 메일 보내기 : 제목(subject)과 본문(body)까지 미리 채우기 -->
    <!-- 띄워쓰기는 %20, 여러값은 &로 연결 -->
    <h2 style="color: rgb(83, 148, 74);">&#9313; 메일 보내기 : 제목(subject)과 본문(body)까지 미리 채우기</h2>
    <p>
        <a href="mailto:emongc1209@gmail.com?subject=수강%20문의&body=안녕하세요.%0A사과 구매 문의드립니다." target="_blank"
            title="구매 담당자에게 이메일 전송">🍎사과구매 문의 메일 보내기</a>
    </p>

    <br>

    <!-- ③ 전화걸기 : 스마트폰에서 누르면 전화 앱이 열림 -->
    <h2 style="color: rgb(83, 148, 74);">&#9314; 전화 걸기</h2>
    <p>
        <a href="tel:010-2535-2205" title="사과구매 담당자 연결">📲담당 : 010-2535-2205</a>
    </p>

    <br>

    <!-- ④ 같은 폴더의 다른 HTML 파일로 이동(상대경로) -->
    <h2 style="color: rgb(83, 148, 74);">&#9315; 내 사이트의 다른 페이지로 이동</h2>
    <p>
        <a href="/html/test09-3.html" target="_blank" title="9-3 서브페이지로 이동합니다">📰🗞9단계 뉴스 컬럼 이동</a>
    </p>

    <br>

    <!-- ⑤ 이미지 링크 걸기 : a태그 안에 img 넣기 -->
    <!-- <img src="https://placehold.co/300x200?text=Hello" alt="임시 이미지"> 임시로 이미지 크기를 설정하여 넣을 때-->
    <h2 style="color: rgb(83, 148, 74);">&#9316; 이미지 링크</h2>
    <p>
        <a href="https://www.naver.com" target="_blank" title="네이버로 이동하기" rel="nooperner noreferrer"><img
                src="https://placehold.co/300x100?text=Hello" /></a>


        <a href="https://www.naver.com" target="_blank" title="네이버로 이동하기" rel="nooperner noreferrer"><img
                src="/img/naver-logo.jpg" alt="네이버이동"/></a>

        <a href="https://www.google.com" target="_blank" title="구글로 이동하기" rel="nooperner noreferrer"><img
                src="/img/google_logojpg.jpg" alt="구글로이동"/></a>
    </p>

    <br>

    <!-- ⑥ 파일 다운로드 : download 속성(같은 사이트의 파일에서 동작) -->
    <h2 style="color: rgb(83, 148, 74);">&#9317; 파일 다운로드</h2>
    <p>
        <a href="/img/naver-logo.jpg" download="실습이미지.jpg" target="_blank">📩실습 이미지 다운로드 받기</a>
        <a href="/html/test01.html" download="실습파일.html" target="_blank">📩실습 HTML 다운로드 받기</a>
    </p>

    <br>

    <!-- 스크롤 공간 확보 -->
    <div style="height: 800px;">⬇ 아래로 스크롤하세요</div>

    <!-- ⑦ 맨 위로 이동하기 : body 태그에 id 값 id="top" 적용 후 이동 -->
    <p>
        <a href="#top" style="font-weight: bold; font-size: x-large;">▲ TOP</a>
    </p>

</html>
