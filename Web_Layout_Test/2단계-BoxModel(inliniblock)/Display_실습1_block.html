<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display 실습1 - block</title>
    <style>
        /* 웹페이지 초기화 */
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        body {
            margin: 0px;
            padding: 20px;
        }

        div.block-box {
            background-color: #81c8f8;
            color: white;
            padding: 10px;
            margin-bottom: 5px;
            /* width: 300px;
            height: 50px;
            text-align: center;
            line-height: 25px; */
        }

        /*마지막 요소에 적용 안하겠다*/
        div.block-box:last-child {
            margin-bottom: 0;
        }

        div.b1 {
            width: 300px;
            height: 50px;
            border-radius: 10px;
            text-align: center;
            line-height: 50px;
        }

        div.b2 {
            width: 400px;
            height: 100px;
            border-radius: 50px;
            text-align: center;
            line-height: 100px;
        }

        /* div.b3 { 
            width: 500px;
            height: 150px;
            border-radius: 150px;
            text-align: center;
            line-height: 150px;
        }*/

        div.b3 {
            width: 500px;
            height: 500px;
            border-radius: 250px;
            text-align: center;
            line-height: 250px;
        }
    </style>
</head>

<body>
    <h2>block 요소 확인</h2>
    <div class="block-box b1">div 태그 - block</div>
    <div class="block-box b2">div 태그 - block</div>
    <div class="block-box b3">div 태그 - block</div>
</body>

</html>
