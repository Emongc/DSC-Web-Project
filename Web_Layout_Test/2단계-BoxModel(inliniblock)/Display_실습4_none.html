<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display_실습4_none</title>
    <style>
        /* 웹페이지 초기화 */
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        div.box-visible {
            background-color: rgb(178, 161, 230);
            color: white;
            padding: 10px;
            margin: 5px;
        }

        /*display:"none" 적용, 보이게하려면 "block"적용 */
        div.box-none {
            background-color: rgb(160, 223, 202);
            color: white;
            padding: 10px;
            margin: 5px;
            display: none;
            /* display: block; */
        }

        /* visibility: "hidden" 적용, 보이게하려면 "visible" 적용 */
        div.box-hidden {
            background-color: rgb(249, 186, 234);
            color: white;
            padding: 10px;
            margin: 5px;
            visibility: hidden;
            /* visibility: visible; */
        }
        /* 번갈아서 적용해보기!! */
    </style>
</head>

<body>
    <h2 style="color: rgb(114, 40, 183);">none 속성 확인</h2>
    <div class="box-visible">① 보이는 박스</div>
    <div class="box-none">② display: "none" → 완전히 사라짐</div>
    <div class="box-hidden">③ visibility: "hidden" → 공간만 남음</div>
    <div class="box-visible">④ 보이는 박스</div>
</body>

</html>
