<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display_실습2_inline</title>
    <style>
        /* 웹페이지 초기화 */
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        span.inline-box{
            background-color: rgb(104, 67, 3);
            color: white;
            padding: 10px;
            width: 200px;
            height: 50px; /* inline 태그는 너비, 높이 적용 안됨 */
            
            <!-- 결과: 나란히 배치, winth / hegiht 무시됨! -->


        }
    </style>
</head>

<body>
    <h2>inline</h2>
    <span class="inline-box">span 태그란? 블럭요소에 또 다른 요소를 추가시 활용!</span>
    <span class="inline-box">span 태그</span>
    <span class="inline-box">span 태그</span>
</body>

</html>
