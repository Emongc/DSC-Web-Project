<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box_model_실습2</title>
    <style>
       /* 웹페이지 초기화 */
       * {
            margin: 0;
            padding: 0px;
            box-sizing: border-box;
        }

        /* body { 
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            min-height: 100vh;
        */
        }

        div.box2 {
            width: 200px;
            height: 100px;
            background-color: #e74c30;
            color: white;
            /*padding 적용 후 비교*/
            padding: 20px;
            /*content-box속성과 border-box 번갈아 적용하기*/
            /*F12 통해서 확인하기*/
            box-sizing: content-box;
            margin-bottom: 20px;
        }

        div.box2:hover {
            background-color: #f43987;
            color: rgb(222, 250, 144);
            box-sizing: content-box;
        }

        div.box2-1 {
            width: 200px;
            height: 100px;
            background-color: blue;
            color: white;
        }

        div.box2-1:hover {
            background-color: rgb(241, 243, 125);
            color: rgb(239, 83, 5);

        }
    </style>
</head>

<body>
    <div class="box2">padding 적용 박스2</div>
    <div class="box2-1">padding 적용 박스2-1</div>

</body>

</html>
